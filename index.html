<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RV Road Trip — 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#a8cce3;font-family:system-ui,Arial;color:white}#hud{position:absolute;top:20px;left:20px;background:#10252ccc;padding:18px 22px;border:1px solid #ffffff30;border-radius:16px;backdrop-filter:blur(8px);min-width:230px}h2{margin:0 0 8px;font-size:19px}#distance{font-size:27px;font-weight:800}#speed{color:#c2dfeb}#help{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:#10252cbb;padding:12px 20px;border-radius:12px;text-align:center;font-size:14px}#win{display:none;position:absolute;inset:0;background:#071b21bd;align-items:center;justify-content:center;flex-direction:column;text-align:center}button{padding:12px 24px;border:0;border-radius:10px;font-weight:700;cursor:pointer}#error{display:none;position:absolute;inset:0;background:#182c35;align-items:center;justify-content:center;text-align:center;padding:30px}</style></head><body><div id="hud"><h2>🚐 Pine Lake Road Trip</h2><div id="distance">1.00 mi remaining</div><div id="speed">0 mph</div><div style="font-size:12px;opacity:.8;margin-top:8px">Destination: Pine Lake Campground</div></div><div id="help">W / ↑ Accelerate · S / ↓ Brake & reverse · A D / ← → Steer · R Reset</div><div id="win"><h1>🏕️ Welcome to Pine Lake!</h1><p>You drove one mile to the campground.</p><button onclick="location.reload()">Drive again</button></div><div id="error">3D engine couldn't load. Connect to the internet and refresh the page.</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa9cce5);scene.fog=new THREE.FogExp2(0xa9cce5,.00043);
const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,4500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd6efff,0x637348,2.4));const sun=new THREE.DirectionalLight(0xffedc4,3);sun.position.set(-140,260,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-220;sun.shadow.camera.right=220;sun.shadow.camera.top=220;sun.shadow.camera.bottom=-220;scene.add(sun);
const mat=(c,r=1,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const grass=mat(0x60834b),asphalt=mat(0x44494b),white=mat(0xece9d8),yellow=mat(0xf3d77a),treeBark=mat(0x65513b),pine=mat(0x28583c),pine2=mat(0x397148),glass=mat(0x243f4d,.16,.2),rvWhite=mat(0xf0eee3,.6,.1),rvBlue=mat(0x28556a),rubber=mat(0x1b1d1c),silver=mat(0xb7bec1,.35,.65);
function cube(w,h,d,material,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(rt,rb,h,material,x,y,z,parent=scene,n=8){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),material);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
// One game unit equals one metre. Road follows the negative Z direction.
const ground=cube(7000,1,7000,grass,0,-.58,-800);ground.castShadow=false;const road=cube(14,.12,1750,asphalt,0,.02,-800);road.castShadow=false;
for(let z=40;z>-1650;z-=22){cube(.2,.025,9,yellow,-.04,.096,z).castShadow=false}for(const x of [-6.55,6.55])cube(.18,.025,1750,white,x,.1,-800).castShadow=false;
// Seeded random so scenery is stable.
let seed=4382;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const trunkGeo=new THREE.CylinderGeometry(.45,.62,5,7),coneGeo=new THREE.ConeGeometry(3.4,10,8);function addTree(x,z,s){const t=new THREE.Group();t.position.set(x,0,z);t.scale.setScalar(s);const trunk=new THREE.Mesh(trunkGeo,treeBark);trunk.position.y=2.5;t.add(trunk);for(let j=0;j<3;j++){const c=new THREE.Mesh(coneGeo,j%2?pine2:pine);c.position.y=6+j*2.7;c.scale.set(1-j*.17,.8,1-j*.17);t.add(c)}scene.add(t)}
for(let z=65;z>-1700;z-=15){for(const side of [-1,1]){if(rand()>.1)addTree(side*(24+rand()*90),z+(rand()-.5)*20,.65+rand()*1.3);if(rand()>.5)addTree(side*(110+rand()*90),z+(rand()-.5)*30,.9+rand()*1.3)}}
// Distant hills.
const hillMat=mat(0x68816c);for(let i=0;i<32;i++){const x=(rand()-.5)*2100,z=-200-rand()*2100;const hill=new THREE.Mesh(new THREE.ConeGeometry(100+rand()*130,140+rand()*160,7),hillMat);hill.position.set(x,40,z);scene.add(hill)}
// Roadside cabin and destination campsite.
function cabin(x,z){cube(12,5,10,mat(0x916e50),x,2.5,z);const roof=new THREE.Mesh(new THREE.ConeGeometry(9,4,4),mat(0x493b35));roof.rotation.y=Math.PI/4;roof.scale.z=.9;roof.position.set(x,7,z);scene.add(roof);cube(2,2,.15,glass,x-3,3,z+5.1);cube(2,3,.15,mat(0x4e3428),x+2,1.5,z+5.12)}cabin(35,-350);cabin(-42,-960);cabin(35,-1590);
const goalZ=-1609.344;const goal=new THREE.Group();goal.position.set(0,0,goalZ);scene.add(goal);cube(20,.15,9,mat(0x8d8068),0,.1,goalZ);for(const x of [-9,9])cube(.5,8,.5,treeBark,x,4,goalZ);cube(19,2.8,.4,mat(0x476e4a),0,7.5,goalZ);const signCanvas=document.createElement('canvas');signCanvas.width=1024;signCanvas.height=170;const ctx=signCanvas.getContext('2d');ctx.fillStyle='#e9f2d5';ctx.font='bold 73px system-ui';ctx.textAlign='center';ctx.fillText('PINE LAKE CAMPGROUND',512,112);const sign=new THREE.Mesh(new THREE.PlaneGeometry(17,2.8),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(signCanvas),transparent:true,side:THREE.DoubleSide}));sign.position.set(0,7.5,goalZ+.27);scene.add(sign);
// Detailed, original procedural motorhome model.
const rv=new THREE.Group();scene.add(rv);const body=new THREE.Group();rv.add(body);cube(2.8,2.5,6.9,rvWhite,0,2.35,0,body);cube(2.86,.45,6.95,rvBlue,0,1.43,0,body);cube(2.9,.18,7.1,rvWhite,0,3.7,0,body);cube(2.65,1.45,1.4,rvWhite,0,3.15,-2.7,body);cube(2.45,.92,.1,glass,0,2.95,-3.52,body);cube(2.45,.88,.09,glass,0,2.95,3.5,body);for(const x of [-1.43,1.43]){for(const z of [-1.6,.7,2.1])cube(.08,.85,1.15,glass,x,2.8,z,body)}cube(.1,1.8,.9,rvBlue,1.46,2.5,-.35,body);cube(2.7,.35,.2,silver,0,1.18,-3.55,body);cube(2.7,.3,.2,silver,0,1.2,3.53,body);cube(1.2,.2,.15,mat(0xffe9ba),0,2.05,-3.58,body);for(const x of [-1.05,1.05]){cube(.52,.28,.1,mat(0xffe8a5),x,1.8,-3.55,body);cube(.45,.28,.1,mat(0xa93228),x,1.8,3.55,body)}
const wheels=[];for(const z of [-2.15,2.1])for(const x of [-1.48,1.48]){const wheel=new THREE.Group();wheel.position.set(x,1.02,z);const tire=new THREE.Mesh(new THREE.CylinderGeometry(.73,.73,.33,20),rubber);tire.rotation.z=Math.PI/2;wheel.add(tire);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.37,.37,.35,16),silver);hub.rotation.z=Math.PI/2;wheel.add(hub);body.add(wheel);wheels.push(wheel)}
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==='r'){rv.position.set(0,0,0);rv.rotation.y=0;speed=0;finished=false;document.getElementById('win').style.display='none'}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let speed=0,finished=false;const clock=new THREE.Clock();const camTarget=new THREE.Vector3();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05);if(!finished){const accelerate=keys.w||keys.arrowup,brake=keys.s||keys.arrowdown,steer=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);if(accelerate)speed+=8*dt;if(brake)speed-=12*dt;if(!accelerate&&!brake)speed*=Math.pow(.965,dt*60);speed=THREE.MathUtils.clamp(speed,-7,24);if(Math.abs(speed)<.04)speed=0;rv.rotation.y+=steer*speed*.018*dt;rv.position.x+=-Math.sin(rv.rotation.y)*speed*dt;rv.position.z+=-Math.cos(rv.rotation.y)*speed*dt;rv.position.x=THREE.MathUtils.clamp(rv.position.x,-170,170);for(const w of wheels)w.rotation.x-=speed*dt/.73;body.rotation.z=THREE.MathUtils.lerp(body.rotation.z,-steer*speed*.002,dt*2);if(rv.position.z<=goalZ+6&&Math.abs(rv.position.x)<11){finished=true;speed=0;document.getElementById('win').style.display='flex'}}const behind=new THREE.Vector3(Math.sin(rv.rotation.y)*14,8,Math.cos(rv.rotation.y)*14).add(rv.position);camera.position.lerp(behind,Math.min(1,dt*3.5));camTarget.set(rv.position.x-Math.sin(rv.rotation.y)*9,2.7,rv.position.z-Math.cos(rv.rotation.y)*9);camera.lookAt(camTarget);sun.position.set(rv.position.x-140,260,rv.position.z+100);sun.target.position.copy(rv.position);sun.target.updateMatrixWorld();const remaining=Math.max(0,(-1609.344-rv.position.z)/-1609.344);document.getElementById('distance').textContent=remaining.toFixed(2)+' mi remaining';document.getElementById('speed').textContent=Math.round(Math.abs(speed)*2.23694)+' mph';renderer.render(scene,camera)}camera.position.set(0,8,17);loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
